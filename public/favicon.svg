<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Premium Neumorphic Background Base -->
  <rect width="512" height="512" rx="140" fill="#EFE9E3" />
  
  <!-- Recessed Canvas Area -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="#F9F8F6" />
  
  <!-- Dynamic Creative Paint Swoosh -->
  <path d="M 120 380 Q 220 380 240 280 T 380 140" fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="380" cy="140" r="14" fill="#3b82f6" />

  <!-- Minimalist Gesture Line Art (Hand drawing/pinching) -->
  <!-- Stroke color matches the warm secondary text #8C7B6E -->
  <path d="M 280 440 
           C 280 370, 290 320, 310 280
           L 380 140
           M 380 140
           C 395 160, 410 200, 390 230
           C 370 260, 350 280, 360 330
           L 370 440" 
        fill="none" stroke="#8C7B6E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Thumb pinch loop -->
  <path d="M 330 240 C 350 240, 370 220, 370 200 C 370 180, 350 170, 340 180" 
        fill="none" stroke="#8C7B6E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
</svg>
